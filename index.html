<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theera — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e17;
    --bg-alt:#0f1420;
    --card:#131a29;
    --border:#22304a;
    --text:#e6edf7;
    --muted:#8b9bb5;
    --accent:#00f7ff;
    --accent2:#7c5cff;
    --accent3:#ff5c9d;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0a0e17; --bg-alt:#0f1420; --card:#131a29; --border:#22304a;
      --text:#e6edf7; --muted:#8b9bb5;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, rgba(0,247,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(124,92,255,0.10), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    overflow-x:auto;
  }
  .avatar{
    width:96px;height:96px;border-radius:50%;
    background:conic-gradient(from 180deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 20px;
    padding:3px;
  }
  .avatar-inner{
    width:100%;height:100%;border-radius:50%;
    background:var(--bg-alt);
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:700;
    color:var(--accent);
  }
  h1{
    text-align:center;
    font-size:32px;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  .role{
    text-align:center;
    color:var(--muted);
    font-family:'Fira Code', monospace;
    font-size:15px;
    min-height:22px;
    margin-bottom:28px;
  }
  .role::after{
    content:'|';
    animation:blink 1s step-end infinite;
    color:var(--accent);
  }
  @keyframes blink{50%{opacity:0;}}
  .socials{
    display:flex;justify-content:center;gap:14px;margin-bottom:32px;flex-wrap:wrap;
  }
  .social-btn{
    display:flex;align-items:center;gap:8px;
    padding:9px 16px;
    border:1px solid var(--border);
    border-radius:999px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
    background:var(--bg-alt);
    transition:all .2s ease;
  }
  .social-btn:hover{
    border-color:var(--accent);
    box-shadow:0 0 16px rgba(0,247,255,0.25);
    transform:translateY(-1px);
  }
  .social-btn svg{width:16px;height:16px;flex-shrink:0;}
  section{margin-bottom:30px;}
  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--accent);
    font-family:'Fira Code', monospace;
    margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title::before{content:'//';color:var(--muted);}
  .about-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .about-list li{
    display:flex;gap:10px;align-items:flex-start;
    font-size:15px;color:var(--text);
    line-height:1.5;
  }
  .about-list b{color:var(--accent2);}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    padding:7px 14px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:8px;
    font-family:'Fira Code', monospace;
    font-size:13px;
    color:var(--text);
    transition:all .2s ease;
  }
  .chip:hover{border-color:var(--accent2);color:var(--accent2);}
  .interests{display:flex;gap:14px;flex-wrap:wrap;}
  .interest-card{
    flex:1;min-width:130px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    text-align:center;
  }
  .interest-card .icon{font-size:28px;margin-bottom:8px;}
  .interest-card .label{font-size:14px;color:var(--muted);}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    font-family:'Fira Code', monospace;
    margin-top:36px;
  }
  footer span{color:var(--accent);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="avatar"><div class="avatar-inner">T</div></div>
      <h1>Theera</h1>
      <div class="role" id="typing"></div>

      <div class="socials">
        <a class="social-btn" href="https://github.com/yourusername" target="_blank" rel="noopener">

          GitHub
        </a>
        <a class="social-btn" href="https://www.linkedin.com/in/yourusername/" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.15C0 .52.53 0 1.19 0h13.62C15.47 0 16 .52 16 1.15v13.7c0 .63-.53 1.15-1.19 1.15H1.19C.53 16 0 15.48 0 14.85V1.15ZM4.75 6.02H2.24V13.5h2.51V6.02ZM3.5 5c.8 0 1.3-.53 1.3-1.19-.02-.68-.5-1.19-1.28-1.19-.79 0-1.3.51-1.3 1.19 0 .66.5 1.19 1.27 1.19h.01ZM13.5 13.5h-2.51V9.5c0-.99-.35-1.66-1.23-1.66-.67 0-1.07.45-1.24.89-.06.15-.08.37-.08.58v4.19H5.94s.03-6.8 0-7.48h2.5v1.06c.33-.51.93-1.24 2.26-1.24 1.65 0 2.8 1.08 2.8 3.39v4.27Z"/></svg>
          LinkedIn
        </a>
        <a class="social-btn" href="mailto:your.email@example.com">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3h13a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm.5 1.8V12h12V4.8L8 9 2 4.8Zm.4-.8L8 8.1 13.1 4H2.4Z"/></svg>
          Email
        </a>
      </div>

      <section>
        <div class="section-title">about me</div>
        <ul class="about-list">
          <li>🎓 กำลังศึกษา: <b>วิศวกรรมคอมพิวเตอร์</b></li>
          <li>🌱 กำลังเรียนรู้: <b>เทคโนโลยีคอมพิวเตอร์</b></li>
        </ul>
      </section>

      <section>
        <div class="section-title">tech stack</div>
        <div class="chips">
          <span class="chip">JavaScript</span>
          <span class="chip">TypeScript</span>
          <span class="chip">React</span>
          <span class="chip">Node.js</span>
          <span class="chip">Python</span>
          <span class="chip">Docker</span>
          <span class="chip">Git</span>
          <span class="chip">Linux</span>
        </div>
      </section>

      <section>
        <div class="section-title">นอกเวลาทำงาน</div>
        <div class="interests">
          <div class="interest-card">
            <div class="icon">⚽</div>
            <div class="label">ฟุตบอล</div>
          </div>
          <div class="interest-card">
            <div class="icon">🎱</div>
            <div class="label">สนุ๊กเกอร์</div>
          </div>
        </div>
      </section>

      <footer>&lt; built with <span>Claude</span> /&gt;</footer>
    </div>
  </div>

<script>
  const roles = [
    "Computer Engineering Student",
    "Football Fan",
    "Snooker Player",
    "Always Learning New Things"
  ];
  const el = document.getElementById('typing');
  let ri = 0, ci = 0, deleting = false;

  function tick(){
    const current = roles[ri];
    if(!deleting){
      ci++;
      el.textContent = current.slice(0, ci);
      if(ci === current.length){
        deleting = true;
        setTimeout(tick, 1400);
        return;
      }
    } else {
      ci--;
      el.textContent = current.slice(0, ci);
      if(ci === 0){
        deleting = false;
        ri = (ri + 1) % roles.length;
      }
    }
    setTimeout(tick, deleting ? 35 : 65);
  }
  tick();
</script>
</body>
</html>
